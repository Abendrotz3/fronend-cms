<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proyectos de IA desde WordPress</title>
</head>
<body>
  <h1>Proyectos de IA desde WordPress</h1>
  <div id="posts"></div>

  <script>
    fetch("http://cms-headless.local/wp-json/wp/v2/posts")
      .then(response => response.json())
      .then(posts => {
        console.log("Datos recibidos:", posts); // <-- Ver en consola
        const container = document.getElementById("posts");
        posts.forEach(post => {
          const div = document.createElement("div");
          div.innerHTML = `
            <h2>${post.title.rendered}</h2>
            <p>${post.excerpt.rendered}</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(error => console.error("Error en fetch:", error));
  </script>
</body>
</html>
